name: Gerar APK Android (mundo calmo)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependências e gerar build web
        run: |
          npm install
          npm run build

      - name: Configurar Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Aplicar ícone do dente-de-leão no Android
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp public/pwa-192x192.png "$dir/ic_launcher.png" || true
              cp public/pwa-192x192.png "$dir/ic_launcher_round.png" || true
            fi
          done
          cp public/pwa-512x512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          cp public/pwa-512x512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png || true

      - name: Compilar APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar arquivo mundo-calmo.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mundo-calmo.apk

      - name: Disponibilizar mundo-calmo.apk para download
        uses: actions/upload-artifact@v4
        with:
          name: mundo-calmo-apk
          path: mundo-calmo.apk
          retention-days: 30
